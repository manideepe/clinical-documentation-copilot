name: Bug report
description: Report a reproducible defect without including PHI or secrets.
body:
  - type: markdown
    attributes:
      value: "Never include patient information, recordings, access tokens, or confidential logs."
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Use synthetic or fabricated data only.
    validations:
      required: true
