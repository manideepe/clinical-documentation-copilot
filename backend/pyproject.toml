[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-documentation-copilot-backend"
version = "1.0.0"
description = "Local, deterministic EHR documentation workflow reference backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.139.0",
  "uvicorn[standard]==0.41.0",
  "cryptography==48.0.1",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.0.3",
  "pip-audit==2.10.1",
  "reportlab==4.4.9",
  "pypdf==6.13.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
